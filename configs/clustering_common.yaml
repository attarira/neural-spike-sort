clustering:
  KMeans:
    - n_clusters: 3
    - n_clusters: 4
    - n_clusters: 5
    - n_clusters: 6
    - n_clusters: 8
  GMM:
    - n_components: 3
      covariance_type: full
    - n_components: 4
      covariance_type: full
    - n_components: 5
      covariance_type: diag
    - n_components: 6
      covariance_type: diag
  SpectralClustering:
    - n_clusters: 3
      affinity: nearest_neighbors
      n_neighbors: 10
      assign_labels: kmeans
    - n_clusters: 5
      affinity: nearest_neighbors
      n_neighbors: 15
      assign_labels: kmeans
    - n_clusters: 7
      affinity: nearest_neighbors
      n_neighbors: 15
      assign_labels: kmeans
  DBSCAN:
    - eps: 0.5
      min_samples: 5
    - eps: 0.8
      min_samples: 5
    - eps: 0.5
      min_samples: 10