# Example Configuration for Spike Sorting Experiments
# This file defines the dimensionality reduction and clustering methods
# to test, along with their hyperparameters.

dimensionality_reduction:
  # Linear Methods
  PCA:
    - n_components: 10
    - n_components: 20
    - n_components: 30
    - n_components: 50
  
  ICA:
    - n_components: 10
    - n_components: 20
    - n_components: 30
  
  # NOT APPLICABLE: LDA requires ground truth labels (supervised)
  # LDA:
  #   - n_components: 5
  #   - n_components: 10
  
  # Nonlinear Methods
  UMAP:
    - n_neighbors: 15
      min_dist: 0.1
      n_components: 10
    - n_neighbors: 30
      min_dist: 0.1
      n_components: 10
    - n_neighbors: 15
      min_dist: 0.5
      n_components: 10
  
  TSNE:
    - perplexity: 30
      n_components: 2
    - perplexity: 50
      n_components: 2
    - perplexity: 30
      n_components: 3
  
  Isomap:
    - n_neighbors: 5
      n_components: 10
    - n_neighbors: 10
      n_components: 10
  
  LLE:
    - n_neighbors: 10
      n_components: 10
    - n_neighbors: 20
      n_components: 10
  
  # NOT APPLICABLE: The following methods are not suitable for spike waveform data
  # GPFA - designed for temporal neural population dynamics
  # SliceTCA - designed for tensor-structured data across conditions
  # LFADS - designed for temporal sequential data
  # CCA - requires two data views/modalities
  
  # GPFA:
  #   - x_dim: 10
  #     bin_size: 20
  
  # SliceTCA:
  #   - n_components: 10
  #     n_slices: 5
  
  # LFADS:
  #   - latent_dim: 10
  #     hidden_dim: 64
  #     epochs: 30

clustering:
  # Parametric Methods
  KMeans:
    - n_clusters: 2
    - n_clusters: 3
    - n_clusters: 4
    - n_clusters: 5
    - n_clusters: 6
    - n_clusters: 7
    - n_clusters: 8
    - n_clusters: 9
    - n_clusters: 10
    - n_clusters: 15
    - n_clusters: 20
  
  GMM:
    - n_components: 2
    - n_components: 3
    - n_components: 4
    - n_components: 5
    - n_components: 6
    - n_components: 7
    - n_clusters: 8
    - n_components: 9
    - n_components: 10
    - n_components: 15
  
  SpectralClustering:
    - n_clusters: 3
    - n_clusters: 5
    - n_clusters: 7
    - n_clusters: 10
  
  # Density-based Methods
  DBSCAN:
    - eps: 0.3
      min_samples: 5
    - eps: 0.5
      min_samples: 5
    - eps: 1.0
      min_samples: 5
    - eps: 0.5
      min_samples: 10
    - eps: 0.5
      min_samples: 20
  
  # Bayesian Nonparametric
  DirichletProcess:
    - n_components: 20
      weight_concentration_prior: 0.01
    - n_components: 30
      weight_concentration_prior: 0.1
