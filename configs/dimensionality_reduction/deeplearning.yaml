dimensionality_reduction:
  Autoencoder:
    - encoding_dim: 10
      hidden_dim: 64
      epochs: 50
      batch_size: 32
      learning_rate: 0.001
    - encoding_dim: 20
      hidden_dim: 64
      epochs: 50
      batch_size: 32
      learning_rate: 0.001
  VAE:
    - encoding_dim: 10
      hidden_dim: 64
      epochs: 50
      batch_size: 32
      learning_rate: 0.001
    - encoding_dim: 20
      hidden_dim: 64
      epochs: 50
      batch_size: 32
      learning_rate: 0.001
  # Contrastive Auto-Encoder is a supervised method - requires ground truth labels (y)
  ContrastiveAutoEncoder:
    - encoding_dim: 10
      hidden_dim: 64
      epochs: 50
      batch_size: 32
      learning_rate: 0.001
      temperature: 0.5
    - encoding_dim: 20
      hidden_dim: 64
      epochs: 50
      batch_size: 32
      learning_rate: 0.001
      temperature: 0.5
  
  # NOT APPLICABLE: LFADS is designed for temporal sequential data
